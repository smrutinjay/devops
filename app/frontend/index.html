<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NimbusCart</title>
<style>
  :root {
    --border: #d9dee3;
    --accent: #2f6fed;
    --error: #c62828;
    --text: #1b1f24;
    --muted: #5b6572;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: var(--text);
  }
  h1 { margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; }
  form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 24px;
  }
  form div { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: var(--muted); }
  input {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    width: 130px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    height: 36px;
  }
  button:hover { opacity: 0.9; }
  #error-box {
    display: none;
    background: #fdecea;
    color: var(--error);
    border: 1px solid #f5c2c0;
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 16px;
    font-size: 14px;
  }
  #empty-state { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
  <h1>NimbusCart</h1>
  <p class="subtitle">Product catalog</p>

  <div id="error-box"></div>

  <table id="items-table">
    <thead>
      <tr><th>Name</th><th>Price</th><th>Stock</th></tr>
    </thead>
    <tbody id="items-body">
      <tr><td colspan="3" id="empty-state">Loading...</td></tr>
    </tbody>
  </table>

  <form id="add-form">
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required />
    </div>
    <div>
      <label for="price">Price</label>
      <input id="price" name="price" type="number" step="0.01" min="0" required />
    </div>
    <div>
      <label for="stock">Stock</label>
      <input id="stock" name="stock" type="number" step="1" min="0" required />
    </div>
    <button type="submit">Add product</button>
  </form>

  <script>
    const API_BASE = "/api";
    const tbody = document.getElementById("items-body");
    const errorBox = document.getElementById("error-box");
    const form = document.getElementById("add-form");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function renderItems(items) {
      tbody.innerHTML = "";
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" id="empty-state">No products yet.</td></tr>';
        return;
      }
      for (const item of items) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(item.name)}</td>
          <td>${Number(item.price).toFixed(2)}</td>
          <td>${item.stock}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadItems() {
      try {
        const res = await fetch(`${API_BASE}/items`);
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        const data = await res.json();
        clearError();
        renderItems(data);
      } catch (err) {
        showError(`Failed to load products: ${err.message}`);
        tbody.innerHTML = '<tr><td colspan="3" id="empty-state">Unable to load products.</td></tr>';
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("name").value.trim(),
        price: parseFloat(document.getElementById("price").value),
        stock: parseInt(document.getElementById("stock").value, 10),
      };
      try {
        const res = await fetch(`${API_BASE}/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        clearError();
        form.reset();
        await loadItems();
      } catch (err) {
        showError(`Failed to add product: ${err.message}`);
      }
    });

    loadItems();
  </script>
</body>
</html>
